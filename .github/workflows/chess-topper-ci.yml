name: Chess Topper app checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, android/chess-topper]
    paths: ["src/**", "package.json", "bun.lock", "vite.config.ts", "tsconfig.json", ".github/workflows/chess-topper-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bun run build
      - run: bunx tsc --noEmit
