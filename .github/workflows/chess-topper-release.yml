name: Chess Topper v1.0.0 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chess-topper-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.0.0"

jobs:
  android:
    name: Build Chess Topper Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set application version
        run: |
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.APP_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Install dependencies
        run: bun install --no-save
      - name: Build the Android web bundle
        run: bun run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      - name: Add and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply Chess Topper knight icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/drawable-nodpi
          rsvg-convert -w 512 -h 512 branding/chess-topper-icon.svg > android/app/src/main/res/drawable-nodpi/chess_topper_logo.png
          sed -i -e 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/chess_topper_logo"#g' -e 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/chess_topper_logo"#g' android/app/src/main/AndroidManifest.xml
      - name: Set Android version name and version code
        run: |
          node -e 'const fs=require("node:fs");const p="android/app/build.gradle";let s=fs.readFileSync(p,"utf8");s=s.replace(/versionCode\s+\d+/, "versionCode "+process.env.VERSION_CODE);s=s.replace(/versionName\s+"[^"]+"/, "versionName \""+process.env.APP_VERSION+"\"");fs.writeFileSync(p,s)'
        env:
          VERSION_CODE: ${{ github.run_number }}
          APP_VERSION: ${{ env.APP_VERSION }}
      - name: Harden Android networking and backup
        run: node scripts/harden-android.mjs
      - name: Check for a stable Android signing key
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure stable Android release signing
        if: steps.android-signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chess-topper-release.jks"
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CHESS_TOPPER_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo "CHESS_TOPPER_KEYSTORE_PATH=$RUNNER_TEMP/chess-topper-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.android-signing.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Build debug-signed APK for first-install testing
        if: steps.android-signing.outputs.configured != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Stage standalone Android APK
        run: |
          mkdir -p release-assets
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-assets/Chess-Topper.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Chess-Topper-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chess-topper-android-release
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Build desktop installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
            asset_globs: linux
          - os: macos-latest
            asset_globs: mac
          - os: windows-latest
            asset_globs: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set desktop package version
        working-directory: desktop
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.APP_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installers without ZIP packages or early publishing
        working-directory: desktop
        run: npm run dist -- --publish never
      - name: Upload direct Windows installer and updater manifest
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: chess-topper-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: Upload direct macOS DMG installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: chess-topper-macos
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux AppImage, DEB and updater metadata
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: chess-topper-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.AppImage.blockmap
            desktop/dist/*.deb
            desktop/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Chess Topper v1.0.0 release assets (no ZIP installers)
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chess-topper-*
          path: release-assets
          merge-multiple: true
      - name: Verify that no ZIP packages are being published
        run: |
          find release-assets -type f -printf '%f\n'
          if find release-assets -type f -iname '*.zip' | grep -q .; then
            echo "ZIP packages are not allowed in the Chess Topper release."
            exit 1
          fi
      - name: Publish Chess Topper v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: Chess Topper v1.0.0
          body: |
            ## Chess Topper v1.0.0

            First public application release. Download the installer for your platform below.

            - Android: `Chess-Topper.apk` when stable signing is configured; otherwise `Chess-Topper-debug.apk` for first-install testing only. Debug builds cannot be used for seamless in-place updates.
            - Windows: `Chess-Topper-Setup-1.0.0.exe`
            - macOS: `Chess-Topper-macOS-1.0.0.dmg`
            - Linux: `Chess-Topper-Linux-x86_64-1.0.0.AppImage` or the `.deb` package.

            Windows and Linux release manifests are included for desktop update checks. macOS updates are delivered as a DMG download. Installers are published as direct APK, EXE, DMG, AppImage and DEB files; no ZIP installer packages are published.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
