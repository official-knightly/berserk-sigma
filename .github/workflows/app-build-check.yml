name: Application build check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-build-check.yml"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Production build
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit
