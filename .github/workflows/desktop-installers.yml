name: Chess Topper Desktop Installers

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "branding/**"
      - ".github/workflows/desktop-installers.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build desktop installer
        working-directory: desktop
        run: npm run dist -- --publish never

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: chess-topper-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 30
