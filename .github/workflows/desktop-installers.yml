name: Chess Topper Desktop Installers
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [chess-topper-platform]
    paths: ["src-tauri/**", "desktop-web/**", ".github/workflows/desktop-installers.yml"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: deb,appimage
          - os: macos-latest
            bundle: dmg
          - os: windows-latest
            bundle: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build desktop installer
        working-directory: src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: chess-topper-${{ runner.os }}-installers
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30
